# The whole system: the Persona provider, its web app, three unrelated relying
# parties and the probe that attacks it. `docker compose up` from a clean clone
# is enough — the API migrates and seeds the database on boot, which is what
# registers the four demo apps as OAuth clients.
#
# The hosted copy runs the same services on Railway, wired by the same
# variables. Its equivalents are listed in the deployment section of README.md;
# change one and check the other. Redis is the newest of them: the API refuses
# to start in production without REDIS_URL, so the service has to exist there
# before a deploy that includes it.
#
# Two URLs point at Persona on purpose. The browser is redirected to
# http://localhost:4400, which it can reach; the demo servers call the token and
# userinfo endpoints at http://api:4400 over the compose network.

x-persona-urls: &persona-urls
  PERSONA_PUBLIC_URL: "http://localhost:4400"
  PERSONA_INTERNAL_URL: "http://api:4400"
  PERSONA_WEB_URL: "http://localhost:4420"

services:
  postgres:
    image: postgres:16
    container_name: persona-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: persona
      POSTGRES_PASSWORD: persona
      POSTGRES_DB: persona
    ports:
      - "55432:5432"
    volumes:
      - persona-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U persona -d persona"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8-alpine
    container_name: persona-redis
    restart: unless-stopped
    # Rate-limit counters. Persistence is on because a Redis that forgets on
    # restart hands an attacker a fresh budget, which is the difference between
    # a control and the appearance of one. `noeviction` matters for the same
    # reason: a full cache must refuse writes so the limiter fails closed,
    # rather than quietly dropping counters and letting everything through.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "56379:6379"
    volumes:
      - persona-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ./persona
      dockerfile: Dockerfile.dev
    container_name: persona-api
    restart: unless-stopped
    # Secrets come from persona/.env, the same file the API reads when it runs
    # on the host. Not required: it is gitignored, and a hard requirement would
    # fail every compose command on a fresh clone — including `npm run db:up`,
    # which starts only Postgres and is what the test suite depends on. The API
    # still refuses to boot without AUTH_SECRET and RESEND_API_KEY; config.ts
    # says so by name.
    env_file:
      - path: ./persona/.env
        required: false
    # These override anything in env_file: inside the compose network the
    # database and the API answer to different hostnames than they do on the
    # host, so the file's host-facing values must not win here.
    environment:
      NODE_ENV: development
      PORT: "4400"
      DATABASE_URL: "postgresql://persona:persona@postgres:5432/persona?schema=public"
      OIDC_ISSUER: "http://localhost:4400/oidc"
      WEB_URL: "http://localhost:4420"
      # Codes go to the log, not to an inbox. Set here rather than left to
      # persona/.env because the seeded demo user is camila@example.com, and
      # Resend refuses example.com outright — so without this, a fresh clone
      # comes up with an account nobody can sign in to. config.ts refuses this
      # value when NODE_ENV=production.
      MAIL_TRANSPORT: "console"
      REDIS_URL: "redis://redis:6379"
    # Seeding is required, not convenience: clients live in the database now, so
    # an unseeded database has no relying parties at all.
    command: sh -c "npx prisma migrate deploy && npm run db:seed && npm run dev"
    ports:
      - "4400:4400"
    # Mount only the code for hot reload; node_modules stays the image's
    # (correct Linux build, never shadowed by the host or left stale).
    volumes:
      - ./persona/src:/app/src
      - ./persona/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./persona/web
      dockerfile: Dockerfile.dev
    container_name: persona-web
    restart: unless-stopped
    environment:
      # next.config.ts proxies /api, /interaction and /oidc here so cookies
      # stay first-party.
      API_URL: "http://api:4400"
    ports:
      - "4420:4420"
    volumes:
      - ./persona/web/src:/app/src
    depends_on:
      - api

  clinic:
    build:
      context: ./demos/clinic
      dockerfile: Dockerfile.dev
    container_name: demo-clinic
    restart: unless-stopped
    environment:
      <<: *persona-urls
      CLIENT_ID: "clinic"
      CLIENT_SECRET: "clinic-dev-secret"
      APP_URL: "http://localhost:4411"
    ports:
      - "4411:4411"
    volumes:
      - ./demos/clinic/src:/app/src
    depends_on:
      - api

  forum:
    build:
      context: ./demos/forum
      dockerfile: Dockerfile.dev
    container_name: demo-forum
    restart: unless-stopped
    environment:
      <<: *persona-urls
      CLIENT_ID: "forum"
      CLIENT_SECRET: "forum-dev-secret"
      APP_URL: "http://localhost:4412"
    ports:
      - "4412:4412"
    volumes:
      - ./demos/forum/src:/app/src
    depends_on:
      - api

  store:
    build:
      context: ./demos/store
      dockerfile: Dockerfile.dev
    container_name: demo-store
    restart: unless-stopped
    environment:
      <<: *persona-urls
      CLIENT_ID: "store"
      CLIENT_SECRET: "store-dev-secret"
      APP_URL: "http://localhost:4413"
    ports:
      - "4413:4413"
    volumes:
      - ./demos/store/src:/app/src
    depends_on:
      - api

  probe:
    build:
      context: ./demos/probe
      dockerfile: Dockerfile.dev
    container_name: demo-probe
    restart: unless-stopped
    environment:
      <<: *persona-urls
      CLIENT_ID: "probe"
      CLIENT_SECRET: "probe-dev-secret"
      APP_URL: "http://localhost:4414"
    ports:
      - "4414:4414"
    volumes:
      - ./demos/probe/src:/app/src
    depends_on:
      - api

volumes:
  persona-pgdata:
  persona-redisdata:
