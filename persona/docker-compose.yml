services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: persona-api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "4400"
      # Inside the compose network Postgres is reached by service name on 5432.
      DATABASE_URL: "postgresql://persona:persona@postgres:5432/persona?schema=public"
    ports:
      - "4400:4400"
    # Mount only the code for hot reload; node_modules stays the image's
    # (correct Linux build, never shadowed by the host or left stale).
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: persona-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: persona
      POSTGRES_PASSWORD: persona
      POSTGRES_DB: persona
    ports:
      - "55432:5432"
    volumes:
      - persona-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U persona -d persona"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  persona-pgdata:
